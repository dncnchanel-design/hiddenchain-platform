services:
  opa:
    image: openpolicyagent/opa:1.17.0
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policy:/policies:ro
    expose:
      - "8181"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    depends_on:
      opa:
        condition: service_started
    restart: unless-stopped
    environment:
      APP_ENV: production
      GIT_COMMIT: ${GIT_COMMIT:?Set the exact deployed commit SHA}
      DATABASE_URL: sqlite:////app/runtime/hiddenchain.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      SIGNING_SECRET: ${SIGNING_SECRET:?Set SIGNING_SECRET in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set the public HTTPS origin in .env.production}
      TEST_FIXTURE_SEED: "false"
      DEMO_CATALOG_SEED: "false"
      DEMO_BUSINESS_SEED: "false"
      TEST_COMPUTE_DELAY_MS: "0"
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-memory://}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-10/minute}
      PRODUCT_NAME: ${PRODUCT_NAME:-隐链明算}
      PRODUCT_SHORT_NAME: ${PRODUCT_SHORT_NAME:-隐链明算}
      PRODUCT_SUBTITLE: ${PRODUCT_SUBTITLE:-多能源可信数据空间}
      PRODUCT_LOGO: ${PRODUCT_LOGO:-}
      PRODUCT_LOGO_COMPACT: ${PRODUCT_LOGO_COMPACT:-}
      PRODUCT_FAVICON: ${PRODUCT_FAVICON:-}
      BRAND_THEME_ID: ${BRAND_THEME_ID:-trusted-space-navy}
      BRAND_PRIMARY: "${BRAND_PRIMARY:-#1768A0}"
      CUSTOMER_NAME: ${CUSTOMER_NAME:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      BUILDER_NAME: ${BUILDER_NAME:-}
      COPYRIGHT_OWNER: ${COPYRIGHT_OWNER:-}
      COPYRIGHT_YEAR: ${COPYRIGHT_YEAR:-}
      SUPPORT_NAME: ${SUPPORT_NAME:-}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      ENVIRONMENT_NAME: ${ENVIRONMENT_NAME:-}
      LOGIN_NOTICE: ${LOGIN_NOTICE:-}
      DID_WALLET_BINDINGS_JSON: "${DID_WALLET_BINDINGS_JSON:-{}}"
      OPA_URL: ${OPA_URL:-http://opa:8181}
      OPA_POLICY_PATH: ${OPA_POLICY_PATH:-/v1/data/hiddenchain/decision}
      OPA_TIMEOUT_SECONDS: ${OPA_TIMEOUT_SECONDS:-1.0}
      OPA_LOCAL_FALLBACK: ${OPA_LOCAL_FALLBACK:-false}
      EXECUTION_POLICY_PATH: ${EXECUTION_POLICY_PATH:-/app/policy/energy_execution_policy.json}
      EXECUTION_AUDIT_WORKERS: ${EXECUTION_AUDIT_WORKERS:-2}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hiddenchain-platform}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_CONSOLE_EXPORT: ${OTEL_CONSOLE_EXPORT:-false}
      OPENLINEAGE_ENABLED: ${OPENLINEAGE_ENABLED:-true}
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-hiddenchain}
      OPENLINEAGE_PATH: ${OPENLINEAGE_PATH:-/app/runtime/lineage/events.jsonl}
      OPENLINEAGE_HTTP_URL: ${OPENLINEAGE_HTTP_URL:-}
      DP_MAX_LOAD_MW: ${DP_MAX_LOAD_MW:-100}
      FISCO_BCOS_RPC_URL: ${FISCO_BCOS_RPC_URL:-}
      FISCO_BCOS_RELAY_URL: ${FISCO_BCOS_RELAY_URL:-}
      FISCO_BCOS_GROUP_ID: ${FISCO_BCOS_GROUP_ID:-group0}
      FISCO_BCOS_NODE_ID: ${FISCO_BCOS_NODE_ID:-}
      FISCO_BCOS_CONTRACT_ADDRESS: ${FISCO_BCOS_CONTRACT_ADDRESS:-}
      FISCO_BCOS_TIMEOUT_SECONDS: ${FISCO_BCOS_TIMEOUT_SECONDS:-10}
      FISCO_BCOS_RECEIPT_POLL_ATTEMPTS: ${FISCO_BCOS_RECEIPT_POLL_ATTEMPTS:-10}
      FISCO_BCOS_RECEIPT_POLL_INTERVAL_SECONDS: ${FISCO_BCOS_RECEIPT_POLL_INTERVAL_SECONDS:-0.5}
      DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-20}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-800}
      PLATFORM_SIGNING_PRIVATE_KEY: ${PLATFORM_SIGNING_PRIVATE_KEY:?Set the platform Ed25519 private key in .env.production}
      SUBJECT_NODE_ENDPOINTS_JSON: ${SUBJECT_NODE_ENDPOINTS_JSON:?Set the organization-to-connector endpoint map in .env.production}
      SUBJECT_NODE_BROWSER_ENDPOINTS_JSON: ${SUBJECT_NODE_BROWSER_ENDPOINTS_JSON:?Set the public organization-to-connector endpoint map in .env.production}
      SUBJECT_NODE_IDS_JSON: ${SUBJECT_NODE_IDS_JSON:?Set the organization-to-connector id map in .env.production}
      SUBJECT_NODE_PUBLIC_KEYS_JSON: ${SUBJECT_NODE_PUBLIC_KEYS_JSON:?Set the organization-to-connector public-key map in .env.production}
      SUBJECT_NODE_PUBLIC_KEY_RINGS_JSON: "${SUBJECT_NODE_PUBLIC_KEY_RINGS_JSON:-{}}"
      CONNECTOR_TIMEOUT_SECONDS: ${CONNECTOR_TIMEOUT_SECONDS:-15}
    volumes:
      - hiddenchain-runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["direct-domain"]
    environment:
      DOMAIN: ${PUBLIC_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  hiddenchain-runtime:
  caddy-data:
  caddy-config:

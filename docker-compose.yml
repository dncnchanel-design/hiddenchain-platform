services:
  opa:
    image: openpolicyagent/opa:1.17.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policy:/policies:ro
    expose:
      - "8181"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      opa:
        condition: service_started
    environment:
      DATABASE_URL: sqlite:////app/runtime/hiddenchain.db
      JWT_SECRET: ${JWT_SECRET:-hiddenchain-compose-demo-jwt-secret}
      SIGNING_SECRET: ${SIGNING_SECRET:-hiddenchain-compose-demo-signing-secret}
      DEMO_SEED: "true"
      MOCK_DELAY_MS: "80"
      OPA_URL: http://opa:8181
      OPA_POLICY_PATH: /v1/data/hiddenchain/decision
      OPA_TIMEOUT_SECONDS: "1.0"
      OPA_LOCAL_FALLBACK: "true"
      EXECUTION_POLICY_PATH: /app/policy/energy_execution_policy.json
      EXECUTION_AUDIT_WORKERS: "2"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hiddenchain-platform}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_CONSOLE_EXPORT: ${OTEL_CONSOLE_EXPORT:-false}
      OPENLINEAGE_ENABLED: ${OPENLINEAGE_ENABLED:-true}
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-hiddenchain}
      OPENLINEAGE_PATH: ${OPENLINEAGE_PATH:-/app/runtime/lineage/events.jsonl}
      OPENLINEAGE_HTTP_URL: ${OPENLINEAGE_HTTP_URL:-}
      DP_MAX_LOAD_MW: ${DP_MAX_LOAD_MW:-100}
      DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-20}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-800}
    volumes:
      - hiddenchain-runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  hiddenchain-runtime:

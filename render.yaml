services:
  - type: web
    name: hiddenchain-platform-review
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/runtime/hiddenchain.db
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: test
      - key: ENVIRONMENT_NAME
        value: 公开测试环境
      - key: BRAND_THEME_ID
        value: power-grid-green
      - key: BRAND_PRIMARY
        value: "#00524B"
      - key: TEST_FIXTURE_SEED
        value: "true"
      - key: TEST_COMPUTE_DELAY_MS
        value: "0"
      - key: OPA_LOCAL_FALLBACK
        value: "true"
      - key: DEEPSEEK_ENABLED
        value: "false"
      - key: EXECUTION_POLICY_PATH
        value: /app/policy/energy_execution_policy.json
      - key: EXECUTION_AUDIT_WORKERS
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNING_SECRET
        generateValue: true

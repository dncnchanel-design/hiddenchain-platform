services:
  - type: web
    name: hiddenchain-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/runtime/hiddenchain.db
      - key: PORT
        value: "10000"
      - key: DEMO_SEED
        value: "true"
      - key: DEEPSEEK_ENABLED
        value: "false"
      - key: EXECUTION_POLICY_PATH
        value: /app/policy/energy_execution_policy.json
      - key: EXECUTION_AUDIT_WORKERS
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNING_SECRET
        generateValue: true

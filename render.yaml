services:
  - type: web
    name: hiddenchain-platform-review
    branch: main
    autoDeployTrigger: checksPass
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/runtime/hiddenchain.db
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: demo
      - key: ENVIRONMENT_NAME
        value: 公开演示环境
      - key: PRODUCT_SUBTITLE
        value: 多能源可信数据空间
      - key: BRAND_THEME_ID
        value: trusted-space-navy
      - key: BRAND_PRIMARY
        value: "#1768A0"
      - key: TEST_FIXTURE_SEED
        value: "false"
      - key: DEMO_CATALOG_SEED
        value: "true"
      - key: DEMO_BUSINESS_SEED
        value: "true"
      - key: TEST_COMPUTE_DELAY_MS
        value: "0"
      - key: OPA_LOCAL_FALLBACK
        value: "true"
      - key: DEEPSEEK_ENABLED
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: EXECUTION_POLICY_PATH
        value: /app/policy/energy_execution_policy.json
      - key: EXECUTION_AUDIT_WORKERS
        value: "2"
      - key: CONNECTOR_TIMEOUT_SECONDS
        value: "60"
      - key: CONNECTOR_ENDPOINTS_JSON
        value: '{"electricity":"https://hiddenchain-electricity-connector.onrender.com","coal":"https://hiddenchain-coal-connector.onrender.com","heat":"https://hiddenchain-heat-connector.onrender.com","gas":"https://hiddenchain-gas-connector.onrender.com","oil":"https://hiddenchain-oil-connector.onrender.com"}'
      - key: SUBJECT_NODE_ENDPOINTS_JSON
        value: '{"org-generator-t01":"https://hiddenchain-electricity-connector.onrender.com","org-retailer-t01":"https://hiddenchain-electricity-retailer.onrender.com","org-exchange-t01":"https://hiddenchain-electricity-exchange.onrender.com","org-coal-t01":"https://hiddenchain-coal-connector.onrender.com","org-heat-t01":"https://hiddenchain-heat-connector.onrender.com","org-gas-t01":"https://hiddenchain-gas-connector.onrender.com","org-oil-t01":"https://hiddenchain-oil-connector.onrender.com"}'
      - key: SUBJECT_NODE_BROWSER_ENDPOINTS_JSON
        value: '{"org-generator-t01":"https://hiddenchain-electricity-connector.onrender.com","org-retailer-t01":"https://hiddenchain-electricity-retailer.onrender.com","org-exchange-t01":"https://hiddenchain-electricity-exchange.onrender.com","org-coal-t01":"https://hiddenchain-coal-connector.onrender.com","org-heat-t01":"https://hiddenchain-heat-connector.onrender.com","org-gas-t01":"https://hiddenchain-gas-connector.onrender.com","org-oil-t01":"https://hiddenchain-oil-connector.onrender.com"}'
      - key: SUBJECT_NODE_IDS_JSON
        value: '{"org-generator-t01":"local-node-org-generator-t01","org-retailer-t01":"local-node-org-retailer-t01","org-exchange-t01":"local-node-org-exchange-t01","org-coal-t01":"local-node-org-coal-t01","org-heat-t01":"local-node-org-heat-t01","org-gas-t01":"local-node-org-gas-t01","org-oil-t01":"local-node-org-oil-t01"}'
      - key: CONNECTOR_PUBLIC_KEYS_JSON
        value: '{}'
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNING_SECRET
        generateValue: true
      - key: DID_WALLET_BINDINGS_JSON
        sync: false
      - key: PLATFORM_SIGNING_PRIVATE_KEY
        generateValue: true
      - key: FISCO_BCOS_RPC_URL
        sync: false
      - key: FISCO_BCOS_RELAY_URL
        sync: false
      - key: FISCO_BCOS_GROUP_ID
        value: group0
      - key: FISCO_BCOS_NODE_ID
        sync: false
      - key: FISCO_BCOS_CONTRACT_ADDRESS
        sync: false
      - key: FISCO_BCOS_TIMEOUT_SECONDS
        value: "10"
      - key: FISCO_BCOS_RECEIPT_POLL_ATTEMPTS
        value: "10"
      - key: FISCO_BCOS_RECEIPT_POLL_INTERVAL_SECONDS
        value: "0.5"

  - type: web
    name: hiddenchain-electricity-connector
    branch: main
    autoDeployTrigger: checksPass
    runtime: docker
    plan: free
    dockerfilePath: ./connector/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENERGY_DOMAIN
        value: electricity
      - key: CONNECTOR_NAME
        value: 电力企业连接器
      - key: CONNECTOR_ID
        value: local-node-org-generator-t01
      - key: ORGANIZATION_ID
        value: org-generator-t01
      - key: CONNECTOR_DATABASE_PATH
        value: /app/runtime/electricity.db
      - key: ALLOW_DEMO_KEY_REGISTRATION
        value: "true"
      - key: CONNECTOR_SEED_SYNTHETIC_DATA
        value: "true"
      - key: CONNECTOR_CORS_ORIGINS
        value: https://hiddenchain-platform-review.onrender.com
      - key: CONNECTOR_SIGNING_PRIVATE_KEY
        generateValue: true


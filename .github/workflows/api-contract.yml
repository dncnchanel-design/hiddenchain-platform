name: API Contract Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "37 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Install Schemathesis
        run: python -m pip install --disable-pip-version-check schemathesis==4.24.3

      - name: Start local API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/hiddenchain-uvicorn.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hiddenchain-uvicorn.pid"

      - name: Wait for OpenAPI schema
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/api/openapi.json > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/hiddenchain-uvicorn.log"
          exit 1

      - name: Install OpenAPI Spec Validator
        run: python -m pip install --disable-pip-version-check openapi-spec-validator==0.9.0

      - name: Validate generated OpenAPI schema
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8765/api/openapi.json > "$RUNNER_TEMP/hiddenchain-openapi.json"
          python -m openapi_spec_validator "$RUNNER_TEMP/hiddenchain-openapi.json"

      - name: Run deterministic API contract checks
        working-directory: backend
        run: >-
          st run http://127.0.0.1:8765/api/openapi.json
          --url http://127.0.0.1:8765
          --include-path-regex '^/api/(health|auth/demo-users)$'
          --phases examples,coverage
          --max-examples 2
          --generation-deterministic
          --request-timeout 5
          --report junit
          --report-junit-path schemathesis-junit.xml
          --no-color

      - name: Upload API contract report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schemathesis-report-${{ github.sha }}
          path: |
            backend/schemathesis-junit.xml
            ${{ runner.temp }}/hiddenchain-uvicorn.log
          if-no-files-found: ignore
          retention-days: 14

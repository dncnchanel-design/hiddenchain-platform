name: Dataspace SHACL Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "57 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shacl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shacl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pyshacl==0.40.1 rdflib==7.6.0

      - name: Validate Dataspace metadata graph
        working-directory: backend
        run: python -m pytest -q tests/test_dataspace_shacl.py

      - name: Check dependency consistency
        run: python -m pip check

name: OPA Policy Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "32 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OPA CLI
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.19.0

      - name: Format and test Rego policies
        run: |
          opa fmt --fail policy/hiddenchain_test.rego
          opa test policy -v

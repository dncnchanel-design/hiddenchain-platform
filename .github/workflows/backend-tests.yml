name: Backend Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Install coverage and randomized test runner
        run: python -m pip install --disable-pip-version-check coverage==7.15.4 pytest-randomly==4.1.0

      - name: Run backend tests with branch coverage
        run: python -m coverage run --branch --source=backend/app -m pytest -q --randomly-seed=20260816

      - name: Enforce backend coverage floor
        run: python -m coverage report --fail-under=75

      - name: Check dependency consistency
        run: python -m pip check

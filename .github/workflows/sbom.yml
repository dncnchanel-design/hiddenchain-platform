name: SBOM

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "32 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: hiddenchain-platform-sbom.cdx.json
          artifact-name: hiddenchain-platform-sbom-${{ github.sha }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

  sign:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Download generated SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hiddenchain-platform-sbom-${{ github.sha }}.cdx.json
          path: sbom

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign and verify SBOM with Sigstore
        env:
          COSIGN_EXPERIMENTAL: "1"
          SBOM_FILE: sbom/hiddenchain-platform-sbom.cdx.json
          BUNDLE_FILE: sbom/hiddenchain-platform-sbom.sigstore.json
        run: |
          cosign sign-blob --yes --bundle "$BUNDLE_FILE" "$SBOM_FILE"
          cosign verify-blob "$SBOM_FILE" \
            --bundle "$BUNDLE_FILE" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/sbom.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Upload signed SBOM bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hiddenchain-platform-sbom-signature-${{ github.sha }}
          path: sbom/hiddenchain-platform-sbom.sigstore.json
          if-no-files-found: error
          retention-days: 14

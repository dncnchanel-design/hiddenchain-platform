name: SBOM

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "32 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@6842eb843b7258993656f41f9c358f5c5331fbe7 # v4.2.2

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: hiddenchain-platform-sbom.cdx.json
          artifact-name: hiddenchain-platform-sbom-${{ github.sha }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

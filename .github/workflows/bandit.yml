name: Python Security Lint

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bandit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit==1.9.4

      - name: Collect full Bandit report
        run: python -m bandit -r backend/app --severity-level low --confidence-level low --exit-zero -f json -o bandit-report.json

      - name: Enforce medium and high severity findings
        run: python -m bandit -r backend/app --severity-level medium --confidence-level medium

      - name: Upload Bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report-${{ github.sha }}
          path: bandit-report.json
          retention-days: 14
